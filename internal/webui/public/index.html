<!-- Hot Potato harness. Not the product: a disposable UI that proves the backend
     works. No build step — Tailwind is the vendored browser build, JS is plain
     ES modules. -->
<meta charset="utf-8">
<title>Hot Potato</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/vendor/tailwind.js"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
</style>

<body class="min-h-screen bg-stone-50 text-stone-900 antialiased dark:bg-stone-950 dark:text-stone-100">

  <header class="border-b border-stone-200 dark:border-stone-800">
    <div class="mx-auto flex max-w-5xl items-baseline justify-between gap-4 px-6 py-5">
      <div class="flex items-baseline gap-3">
        <h1 class="text-lg font-semibold tracking-tight">Hot Potato</h1>
        <p class="hidden text-sm text-stone-500 sm:block dark:text-stone-400">
          files that never touch the disk
        </p>
      </div>
      <div class="flex items-baseline gap-4 font-mono text-xs text-stone-500 dark:text-stone-400">
        <span data-instance>—</span>
        <span data-session class="hidden items-baseline gap-2 sm:flex">
          <span data-whoami class="text-stone-900 dark:text-stone-100"></span>
          <button data-signout class="underline decoration-dotted hover:text-stone-900 dark:hover:text-stone-100">
            sign out
          </button>
        </span>
      </div>
    </div>
  </header>

  <!-- One pair of pickers for every row's send buttons: the row says who, the
       picker says what. -->
  <input data-file type="file" class="hidden">
  <input data-folder type="file" webkitdirectory directory multiple class="hidden">

  <main class="mx-auto max-w-3xl px-6 py-10">
    <div class="space-y-10">

      <!-- Signed out: the only thing worth showing. -->
      <section data-auth class="hidden">
        <h2 class="font-mono text-xs uppercase tracking-widest text-stone-500 dark:text-stone-400">
          Identity
        </h2>
        <form data-authform class="mt-4 max-w-sm space-y-4 rounded-lg border border-stone-200 p-6 dark:border-stone-800">
          <div class="flex gap-1 font-mono text-xs">
            <button type="button" data-mode="login"
              class="rounded px-2 py-1 text-stone-500 dark:text-stone-400">sign in</button>
            <button type="button" data-mode="signup"
              class="rounded px-2 py-1 text-stone-500 dark:text-stone-400">sign up</button>
          </div>

          <label class="block">
            <span class="font-mono text-xs uppercase tracking-wider text-stone-500 dark:text-stone-400">Email</span>
            <input name="email" type="email" required autocomplete="email"
              class="mt-1 w-full rounded border border-stone-300 bg-transparent px-2 py-1.5 text-sm outline-none focus:border-stone-500 dark:border-stone-700">
          </label>

          <label data-displayname class="block">
            <span class="font-mono text-xs uppercase tracking-wider text-stone-500 dark:text-stone-400">Display name</span>
            <input name="displayName" type="text" autocomplete="nickname"
              class="mt-1 w-full rounded border border-stone-300 bg-transparent px-2 py-1.5 text-sm outline-none focus:border-stone-500 dark:border-stone-700">
          </label>

          <label class="block">
            <span class="font-mono text-xs uppercase tracking-wider text-stone-500 dark:text-stone-400">Password</span>
            <input name="password" type="password" required minlength="8" autocomplete="current-password"
              class="mt-1 w-full rounded border border-stone-300 bg-transparent px-2 py-1.5 text-sm outline-none focus:border-stone-500 dark:border-stone-700">
          </label>

          <p data-autherror class="hidden text-sm text-rose-600 dark:text-rose-400"></p>

          <button type="submit"
            class="w-full rounded bg-stone-900 px-3 py-2 text-sm font-medium text-stone-50 hover:bg-stone-700 disabled:opacity-50 dark:bg-stone-100 dark:text-stone-900 dark:hover:bg-stone-300">
            <span data-submitlabel>Sign in</span>
          </button>
        </form>
      </section>

      <!-- Offers waiting on a decision. Loud on purpose. -->
      <section data-offers class="hidden">
        <h2 class="font-mono text-xs uppercase tracking-widest text-stone-500 dark:text-stone-400">
          Incoming
        </h2>
        <ul data-list class="mt-4 space-y-3"></ul>
      </section>

      <!-- Signed in: everyone else holding a Stream right now, each row its own
           send button. -->
      <section data-online class="hidden">
        <div class="flex items-baseline justify-between gap-4">
          <h2 class="font-mono text-xs uppercase tracking-widest text-stone-500 dark:text-stone-400">
            Online <span data-count class="tabular-nums">0</span>
          </h2>
          <p class="flex items-center gap-2 font-mono text-xs text-stone-500 dark:text-stone-400">
            <span data-streamdot class="size-2 rounded-full bg-amber-500"></span>
            <span data-streamlabel>connecting…</span>
          </p>
        </div>
        <ul data-list class="mt-4 divide-y divide-stone-200 rounded-lg border border-stone-200 px-4 py-2 dark:divide-stone-800 dark:border-stone-800"></ul>
        <p data-senderror class="mt-3 hidden text-sm text-rose-600 dark:text-rose-400"></p>
      </section>

      <!-- Everything in flight, both directions. -->
      <section data-transfers class="hidden">
        <h2 class="font-mono text-xs uppercase tracking-widest text-stone-500 dark:text-stone-400">
          Transfers
        </h2>
        <ul data-list class="mt-4 divide-y divide-stone-200 rounded-lg border border-stone-200 px-4 dark:divide-stone-800 dark:border-stone-800"></ul>
      </section>

    </div>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
