name: hotpotato

# `docker compose up postgres redis nats` is enough to run the tests and a local
# server. `docker compose up` brings the whole two-instance topology: that is
# where the asymmetry between the planes stops being theory.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hotpotato
      POSTGRES_PASSWORD: hotpotato
      POSTGRES_DB: hotpotato
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotpotato -d hotpotato"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    # No persistence: everything here is presence and a read model, all of it
    # self-expiring and all of it rebuilt by the next refresh (ADR 0005).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222" # monitoring
    command: ["--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Phase 8's comparison subject. KRaft, one node, no ZooKeeper.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two listeners, because the containers reach it by service name and the
      # test suite reaches it from the host.
      KAFKA_LISTENERS: DOCKER://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # A group per instance means groups are created constantly; waiting three
      # seconds to rebalance each one is not something this workload can afford.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  inst-a: &instance
    build: .
    environment: &instance-env
      HP_ADDR: ":8080"
      HP_INSTANCE_ID: inst-a
      # Browser-reachable, because the client is the one that follows the 307.
      # A container-internal name here would redirect a browser to a host it
      # cannot resolve.
      HP_EXTERNAL_URL: http://localhost:8081
      HP_DATABASE_URL: postgres://hotpotato:hotpotato@postgres:5432/hotpotato
      HP_REDIS_URL: redis://redis:6379/0
      HP_BUS: nats
      HP_NATS_URL: nats://nats:4222
      HP_LOG_LEVEL: info
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  inst-b:
    <<: *instance
    environment:
      <<: *instance-env
      HP_INSTANCE_ID: inst-b
      HP_EXTERNAL_URL: http://localhost:8082
    ports:
      - "8082:8080"

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - inst-a
      - inst-b
