name: hotpotato

# Local dependencies only. The app itself runs from `go run ./cmd/server` until
# phase 7, where two instances behind a proxy become the point.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hotpotato
      POSTGRES_PASSWORD: hotpotato
      POSTGRES_DB: hotpotato
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotpotato -d hotpotato"]
      interval: 2s
      timeout: 2s
      retries: 15
